name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # 認証情報を必要としないテストのみ。
      # 実APIを叩くテスト（test:v1）はキーが要るためここでは回さない。
      - run: npm test

      - run: npm run build
